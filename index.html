<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SCALEITIVITY ARCADE</title>
<style>
.nav-btn{position:relative}
.bdg{position:absolute;top:4px;right:14%;background:var(--lose);color:#fff;font-family:'Press Start 2P';font-size:6px;min-width:15px;padding:3px 4px;text-align:center}
.bdg.g{background:var(--win);color:#0B2E18}
.overdue-pill{font-family:'Press Start 2P';font-size:6px;background:var(--lose);color:#fff;padding:4px 7px;display:inline-block;margin-bottom:8px;animation:blink 1s steps(2) infinite}
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0D0A1A; --panel:#1A1430; --panel-hi:#251C42; --line:#3A2E63;
  --p1:#FFD34D; --p2:#4DE3FF; --p3:#FF5FA2; --p4:#6DFF8F;
  --txt:#EFEAFF; --dim:#8F84B8; --win:#6DFF8F; --lose:#FF6B6B; --gold:#FFD34D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--txt);overscroll-behavior:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.px{font-family:'Press Start 2P',monospace;line-height:1.6}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:92px}

/* header */
header{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:'Press Start 2P';font-size:11px;color:var(--gold);text-shadow:0 0 12px rgba(255,211,77,.6)}
.logo small{display:block;font-size:7px;color:var(--dim);margin-top:5px;text-shadow:none;letter-spacing:.1em}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);padding:6px 10px;cursor:pointer;font-family:'Press Start 2P';font-size:8px}
.me-dot{width:12px;height:12px;background:var(--dim)}

/* boss meter */
.gate{margin:8px 16px 4px;background:var(--panel);border:3px solid var(--gold);padding:12px 14px;box-shadow:0 0 0 3px var(--bg),0 0 24px rgba(255,211,77,.25);image-rendering:pixelated}
.gate .lbl{font-family:'Press Start 2P';font-size:8px;color:var(--gold);letter-spacing:.05em}
.seats{display:flex;gap:6px;margin:10px 0 8px}
.seat{flex:1;height:30px;border:2px dashed var(--line);display:grid;place-items:center;font-family:'Press Start 2P';font-size:6.5px;color:var(--dim)}
.seat.filled{background:var(--gold);border:2px solid var(--gold);color:#141414;text-shadow:none;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 16px rgba(255,211,77,.8)}}
.track{height:14px;border:2px solid var(--line);background:#0A0716;padding:2px}
.track i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,#E0B22E 8px 16px);transition:width .6s steps(8)}
.gate .sub{display:flex;justify-content:space-between;font-family:'Press Start 2P';font-size:6.5px;color:var(--dim);margin-top:7px}

main{flex:1;padding:8px 16px 16px}
h2{font-family:'Press Start 2P';font-size:13px;margin:14px 0 6px;color:var(--txt)}
.sub-h{color:var(--dim);font-size:13px;margin-bottom:14px;line-height:1.5}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 12px;background:var(--panel);border:2px solid var(--line);font-family:'Press Start 2P';font-size:7px;color:var(--dim);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--txt);color:#141414;border-color:var(--txt)}
.chip .n{color:var(--gold);margin-left:5px}
.chip.on .n{color:#8a6a00}

/* cards */
.card{background:var(--panel);border:2px solid var(--line);padding:13px 14px;margin-bottom:10px;cursor:pointer;position:relative}
.card:active{transform:translate(2px,2px)}
.card.rdy{border-color:var(--win);box-shadow:0 0 14px rgba(109,255,143,.2)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .nm{font-weight:800;font-size:15.5px}
.card .city{color:var(--dim);font-size:12.5px;margin-top:2px}
.stage-pill{font-family:'Press Start 2P';font-size:6.5px;padding:5px 8px;white-space:nowrap;border:2px solid}
.st1{color:var(--txt);border-color:var(--line)}
.st2{color:var(--p3);border-color:var(--p3)}
.st3{color:var(--win);border-color:var(--win)}
.st4{color:var(--p2);border-color:var(--p2)}
.st5{color:#141414;background:var(--gold);border-color:var(--gold)}
.st6{color:#0B2E18;background:var(--win);border-color:var(--win)}
.st7{color:var(--lose);border-color:var(--lose)}
.st8{color:var(--dim);border-color:var(--line)}
.card .ammo{margin-top:9px;font-size:12.5px;color:var(--gold);background:#0A0716;border-left:4px solid var(--gold);padding:8px 10px;line-height:1.45}
.card .meta{margin-top:8px;font-size:11.5px;color:var(--dim)}
.empty{padding:30px 18px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7;border:2px dashed var(--line)}
.empty .px{font-size:9px;color:var(--txt);display:block;margin-bottom:8px}

/* forms */
label{display:block;font-family:'Press Start 2P';font-size:7px;color:var(--dim);margin:14px 0 6px;letter-spacing:.05em}
input,select,textarea{width:100%;background:#0A0716;border:2px solid var(--line);padding:12px;color:var(--txt);font-family:'Outfit';font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px rgba(255,211,77,.3)}
input[type="date"]{color-scheme:dark;min-height:47px;-webkit-appearance:none;appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:none;padding:15px;font-family:'Press Start 2P';font-size:9px;cursor:pointer;margin-top:16px;border:2px solid transparent}
.btn:active{transform:translate(2px,2px)}
.btn.gold{background:var(--gold);color:#141414;box-shadow:0 4px 0 #A8861B}
.btn.gold:active{box-shadow:0 1px 0 #A8861B}
.btn.mint{background:var(--win);color:#0B2E18;box-shadow:0 4px 0 #2E9B52}
.btn.mint:active{box-shadow:0 1px 0 #2E9B52}
.btn.red{background:transparent;color:var(--lose);border-color:var(--lose)}
.btn.ghost{background:transparent;color:var(--dim);border-color:var(--line);margin-top:8px}
.btn:disabled{opacity:.35}

/* audit tests */
.test{background:var(--panel);border:2px solid var(--line);padding:13px;margin-bottom:10px}
.test.done{border-color:var(--win)}
.t-head{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
.badge{width:26px;height:26px;display:grid;place-items:center;font-family:'Press Start 2P';font-size:9px;background:#0A0716;color:var(--dim);border:2px solid var(--line);flex:0 0 auto}
.test.done .badge{background:var(--win);color:#0B2E18;border-color:var(--win)}
.t-sub{font-size:12px;color:var(--dim);margin:5px 0 0 36px;line-height:1.5}
.t-in{margin:10px 0 0 36px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t-in.single{grid-template-columns:1fr}
.pts{margin-left:auto;font-family:'Press Start 2P';font-size:8px;color:var(--gold)}

/* close */
.big{background:var(--panel-hi);border:2px solid var(--gold);padding:15px;margin-bottom:12px;box-shadow:0 0 16px rgba(255,211,77,.12)}
.big .nm{font-family:'Press Start 2P';font-size:10px;line-height:1.5}
.big .am{color:var(--gold);font-size:14px;line-height:1.55;margin-top:9px;font-weight:600}
.big .contact{color:var(--dim);font-size:12.5px;margin-top:8px}
.act-row{display:flex;gap:8px;margin-top:12px}
.act-row .btn{margin-top:0;padding:12px;font-size:8px}

/* high score table */
.hs{border:3px solid var(--line);background:var(--panel)}
.hs-head{font-family:'Press Start 2P';font-size:7px;color:var(--dim);display:grid;grid-template-columns:30px 1fr 84px 70px;padding:10px 12px;border-bottom:2px solid var(--line)}
.hs-row{display:grid;grid-template-columns:30px 1fr 84px 70px;align-items:center;padding:12px;border-bottom:2px solid #0A0716}
.hs-row:last-child{border:none}
.hs-row .rk{font-family:'Press Start 2P';font-size:10px}
.hs-row .nm2{font-weight:800;font-size:14px}
.hs-row .lane{font-size:11px;color:var(--dim)}
.hs-row .lvl{font-family:'Press Start 2P';font-size:6.5px;line-height:1.5}
.hs-row .sc{font-family:'Press Start 2P';font-size:9px;text-align:right}
.xp{height:6px;background:#0A0716;border:1px solid var(--line);margin-top:5px}
.xp i{display:block;height:100%}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--panel);border:2px solid var(--line);padding:12px 13px}
.stat .v{font-family:'Press Start 2P';font-size:16px}
.stat .k{font-size:10.5px;color:var(--dim);margin-top:6px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.stat.warn{border-color:var(--lose)}.stat.warn .v{color:var(--lose)}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#0A0716;border-top:3px solid var(--line);display:flex;justify-content:center;z-index:50}
.nav-inner{display:flex;width:100%;max-width:520px}
.nav-btn{flex:1;padding:11px 0 max(11px, env(safe-area-inset-bottom));background:none;border:none;color:var(--dim);font-family:'Press Start 2P';font-size:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.nav-btn .ico{font-size:17px;line-height:1;font-family:'Outfit'}
.nav-btn.on{color:var(--gold);text-shadow:0 0 10px rgba(255,211,77,.7)}

/* player select */
.psel-bg{position:fixed;inset:0;background:rgba(10,7,22,.96);z-index:150;display:grid;place-items:center;padding:20px}
.psel{width:100%;max-width:420px;text-align:center}
.psel h3{font-family:'Press Start 2P';font-size:13px;color:var(--gold);text-shadow:0 0 14px rgba(255,211,77,.6);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.psel .hint{font-size:12px;color:var(--dim);margin:10px 0 18px}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p-card{background:var(--panel);border:3px solid var(--line);padding:18px 10px;cursor:pointer}
.p-card:active{transform:scale(.96)}
.p-card .pn{font-family:'Press Start 2P';font-size:8px;margin-bottom:10px}
.p-card .pv{width:40px;height:40px;margin:0 auto 10px;image-rendering:pixelated;display:grid;place-items:center;font-family:'Press Start 2P';font-size:14px;color:#141414}
.p-card .nm3{font-weight:800;font-size:14px}
.p-card .ln{font-size:10.5px;color:var(--dim);margin-top:3px}

/* modal / toast / fx */
.modal-bg{position:fixed;inset:0;background:rgba(10,7,22,.85);z-index:100;display:grid;place-items:end center}
.modal{background:var(--bg);border-top:3px solid var(--gold);width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.modal h3{font-family:'Press Start 2P';font-size:11px;line-height:1.6}
.m-city{color:var(--dim);font-size:13px;margin:6px 0 10px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--gold);color:#141414;font-family:'Press Start 2P';font-size:8px;padding:12px 18px;z-index:300;transition:transform .3s steps(5);box-shadow:0 5px 0 #A8861B;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
#flash{position:fixed;inset:0;background:var(--win);z-index:250;opacity:0;pointer-events:none}
#flash.go{animation:flashA .5s steps(3)}
@keyframes flashA{0%{opacity:.55}100%{opacity:0}}
.confetti{position:fixed;width:10px;height:10px;z-index:280;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.loading{padding:60px 0;text-align:center;color:var(--dim);font-family:'Press Start 2P';font-size:8px;line-height:2}

/* ============ JUICE: living background ============ */
#bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bgfx .orb{position:absolute;width:48vw;height:48vw;max-width:420px;max-height:420px;border-radius:50%;filter:blur(70px);opacity:.15;animation:drift 16s ease-in-out infinite alternate}
#bgfx .o1{background:#FFD34D;top:-12%;left:-15%}
#bgfx .o2{background:#4DE3FF;top:24%;right:-18%;animation-delay:-6s}
#bgfx .o3{background:#FF5FA2;bottom:-10%;left:10%;animation-delay:-11s}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.3)}}
#bgfx .grid{position:absolute;left:-60%;right:-60%;bottom:-14%;height:52%;
  background:linear-gradient(transparent 0 94%,rgba(77,227,255,.33) 94% 100%) 0 0/64px 30px,
             linear-gradient(90deg,transparent 0 94%,rgba(77,227,255,.22) 94% 100%) 0 0/64px 30px;
  transform:perspective(330px) rotateX(62deg);animation:gridmove 2.8s linear infinite;
  -webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
@keyframes gridmove{to{background-position:0 30px,0 30px}}

/* juice: motion on existing elements */
.logo{animation:logoGlow 2.6s ease-in-out infinite}
@keyframes logoGlow{50%{text-shadow:0 0 22px rgba(255,211,77,.95),0 0 46px rgba(255,211,77,.45)}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card,.big,.test,.stat,.hs,.lobby-team{animation:cardIn .38s cubic-bezier(.2,.9,.3,1.15) both}
.card{transition:transform .16s,box-shadow .16s,border-color .16s}
@media(hover:hover){.card:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(255,211,77,.22);transform:translateY(-2px)}}
.card.rdy{animation:cardIn .38s both,rdyPulse 2.2s ease-in-out .4s infinite}
@keyframes rdyPulse{50%{box-shadow:0 0 28px rgba(109,255,143,.5)}}
.track i{animation:trackflow 1.1s linear infinite}
@keyframes trackflow{to{background-position:16px 0}}
.btn.gold{position:relative;overflow:hidden}
.btn.gold::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-60%}90%,100%{left:130%}}
.nav-btn .ico{display:inline-block}
.nav-btn.on .ico{animation:icoBounce .7s ease infinite alternate}
@keyframes icoBounce{to{transform:translateY(-3px)}}
.st5,.st6{animation:pillGlow 1.8s ease-in-out infinite}
@keyframes pillGlow{50%{filter:brightness(1.25) drop-shadow(0 0 6px currentColor)}}
.bdg{animation:bdgPop .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes bdgPop{from{transform:scale(0)}}

/* juice: celebrations */
.flypt{position:fixed;z-index:290;font-family:'Press Start 2P';font-size:13px;color:var(--gold);text-shadow:0 0 12px rgba(255,211,77,.9);pointer-events:none;animation:flyup 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes flyup{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-76px) scale(1.4)}}
.burst{position:fixed;width:8px;height:8px;z-index:285;pointer-events:none}
.celebrate-bg{position:fixed;inset:0;z-index:260;display:grid;place-items:center;background:rgba(10,7,22,.55);pointer-events:none;animation:celebFade 1.7s forwards}
.celebrate-bg.mega{animation-duration:2.6s;background:rgba(10,7,22,.72)}
@keyframes celebFade{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
.celeb{text-align:center;padding:0 14px}
.celeb .big-t{font-family:'Press Start 2P';font-size:21px;line-height:1.5;color:var(--gold);text-shadow:0 0 18px rgba(255,211,77,.9),0 0 52px rgba(255,211,77,.5);animation:celebZoom .55s cubic-bezier(.2,1.5,.3,1) both}
.celeb .sub-t{font-family:'Press Start 2P';font-size:9px;line-height:1.8;color:var(--txt);margin-top:14px;animation:celebZoom .55s .14s cubic-bezier(.2,1.5,.3,1) both}
@keyframes celebZoom{from{opacity:0;transform:scale(.2) rotate(-5deg)}to{opacity:1;transform:none}}
@keyframes shakeA{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(3px,-1px)}30%,70%{transform:translate(-3px,2px)}40%,60%{transform:translate(3px,1px)}50%{transform:translate(-2px,-2px)}}
body.shake #app{animation:shakeA .5s both}

/* ============ BREAK ROOM (doubles pong) ============ */
.pong-score{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P';margin:4px 0 8px}
.pong-score .s{font-size:22px}
.pong-score .mid{font-size:7px;color:var(--dim);text-align:center;line-height:1.8}
#pong-box{position:relative}
#pong-cv{width:100%;display:block;background:#070512;border:3px solid var(--line);image-rendering:pixelated;touch-action:none;cursor:ns-resize}
.count-overlay{position:absolute;inset:0;display:grid;place-items:center;font-family:'Press Start 2P';font-size:42px;color:var(--gold);text-shadow:0 0 26px rgba(255,211,77,.95);pointer-events:none}
.lobby-team{border:2px solid var(--line);background:var(--panel);padding:12px;margin-bottom:10px}
.lobby-team h4{font-family:'Press Start 2P';font-size:9px;margin-bottom:4px}
.slot{display:flex;align-items:center;gap:9px;border:2px dashed var(--line);padding:11px;margin-top:8px;font-weight:800;font-size:14px;color:var(--dim);cursor:pointer}
.slot.taken{border-style:solid;color:var(--txt)}
.slot.mine{border-style:solid;border-color:var(--gold);box-shadow:0 0 10px rgba(255,211,77,.25)}
.slot .dot{width:10px;height:10px;background:var(--dim);flex:0 0 auto}
.pong-status{font-family:'Press Start 2P';font-size:7px;color:var(--dim);line-height:2;margin-top:12px}
/* perf: kill expensive layers while a match is running */
body.gaming::after{display:none}
body.gaming #bgfx{display:none}
body.gaming .logo{animation:none}
/* lead intel links */
.clink{color:var(--p2);text-decoration:none;font-weight:700;border-bottom:1px dotted var(--p2)}
.intel-row{margin-top:9px;font-size:12.5px;color:var(--dim);line-height:2}
.intel-row b{color:var(--txt);font-weight:800}
.miss{color:var(--lose);font-weight:700}
/* audit clock chips */
.clock{font-family:'Press Start 2P';font-size:6px;padding:5px 8px;display:inline-block;margin-top:9px;line-height:1.6}
.clock.ok{color:#0B2E18;background:var(--win)}
.clock.warn{color:#141414;background:var(--gold)}
.clock.hot{color:#fff;background:var(--lose);animation:blink 1s steps(2) infinite}
/* day-30 proof checklist */
.proof-row{display:flex;align-items:center;gap:11px;border:2px solid var(--line);padding:11px;margin-top:8px;font-size:13.5px;font-weight:700;cursor:pointer}
.proof-row.done{border-color:var(--win)}
.proof-row input{width:auto;accent-color:var(--win);transform:scale(1.5);cursor:pointer}
.d30-chip{font-family:'Press Start 2P';font-size:6px;padding:4px 7px;display:inline-block;background:#0A0716;border:2px solid var(--gold);color:var(--gold)}
.d30-chip.danger{border-color:var(--lose);color:var(--lose);animation:blink 1s steps(2) infinite}
/* source scoreboard */
.src-row{display:grid;grid-template-columns:1fr 70px 70px;padding:11px 12px;border-bottom:2px solid #0A0716;font-size:13.5px;font-weight:700;align-items:center}
.src-row:last-child{border-bottom:none}
.src-row .h{font-family:'Press Start 2P';font-size:6.5px;color:var(--dim);font-weight:400}
/* ============ INTEL DATABASE ============ */
.db-sum{font-family:'Press Start 2P';font-size:6.5px;color:var(--dim);line-height:2.2;border:2px solid var(--line);background:#0A0716;padding:10px 12px;margin-bottom:12px}
.db-sum b{color:var(--gold);font-weight:400}
.db-card{background:var(--panel);border:2px solid var(--line);margin-bottom:12px;overflow:hidden}
.db-head{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:2px solid #0A0716;background:var(--panel-hi)}
.db-id{font-family:'Press Start 2P';font-size:6px;color:var(--dim);flex:0 0 auto}
.db-head .nm{font-weight:800;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-badge{font-family:'Press Start 2P';font-size:8px;padding:5px 8px;border:2px solid;margin-left:auto;white-space:nowrap;flex:0 0 auto}
.rd-mini{font-family:'Press Start 2P';font-size:6.5px;padding:4px 7px;border:2px solid;display:inline-block;margin-top:8px}
.db-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:#0A0716;padding:2px}
.db-cell{background:var(--panel);padding:9px 11px;min-width:0}
.db-k{display:block;font-family:'Press Start 2P';font-size:5.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.05em}
.db-v{font-size:13px;font-weight:800;line-height:1.35;word-break:break-word}
.db-ammo{padding:9px 12px;font-size:12.5px;color:var(--gold);background:#0A0716;border-top:2px solid #0A0716}
.db-foot{padding:9px 12px;font-size:11px;color:var(--dim);border-top:2px solid #0A0716}
</style>
</head>
<body>
<div id="bgfx"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div></div>
<div id="app">
  <header>
    <div class="logo">SCALEITIVITY<small>ARCADE MODE · 4 PLAYER CO-OP</small></div>
    <div class="me-chip" onclick="openSelect()"><div class="me-dot" id="me-dot"></div><span id="me-name">SELECT</span></div>
  </header>

  <div class="gate">
    <div class="lbl">★ THE GATE ★</div>
    <div class="seats" id="seats"></div>
    <div class="track"><i id="track-fill" style="width:0%"></i></div>
    <div class="sub"><span id="gate-left">FOUNDING SEATS: 3</span><span id="gate-right">0/20 CLIENTS</span></div>
  </div>

  <main id="main"><div class="loading">INSERT COIN<br>LOADING HQ...</div></main>

  <nav><div class="nav-inner">
    <button class="nav-btn on" data-t="board" onclick="go('board')"><span class="ico">▦</span>BOARD</button>
    <button class="nav-btn" data-t="hunt" onclick="go('hunt')"><span class="ico">＋</span>HUNT</button>
    <button class="nav-btn" data-t="shop" onclick="go('shop')"><span class="ico">◉</span>SHOP</button>
    <button class="nav-btn" data-t="close" onclick="go('close')"><span class="ico">✦</span>CLOSE</button>
    <button class="nav-btn" data-t="intel" onclick="go('intel')"><span class="ico">▤</span>INTEL</button>
    <button class="nav-btn" data-t="score" onclick="go('score')"><span class="ico">▲</span>SCORE</button>
    <button class="nav-btn" data-t="game" onclick="go('game')"><span class="ico">◓</span>BREAK</button>
  </div></nav>
</div>
<div id="toast"></div><div id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIG ============ */
const KEY='scaleitivity-leads-v2';
const SUPABASE_URL='https://zzxdozpzjtoppnntrgsz.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_uxUAcxRVtjjs8RvUQDK2nw_1kYQD7rA';
const SB_HEADERS={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'};
const P={
  Giancarlo:{n:'P1',c:'var(--p1)',hex:'#FFD34D',lane:'CALLER+CLOSER · meetings & wins'},
  Chandler:{n:'P2',c:'var(--p2)',hex:'#4DE3FF',lane:'SCOUT · leads found'},
  Kon:{n:'P3',c:'var(--p3)',hex:'#FF5FA2',lane:'SHOPPER · audits done'},
  Fein:{n:'P4',c:'var(--p4)',hex:'#6DFF8F',lane:'FLEX · leads + audits'}
};
const FOUNDERS=Object.keys(P);
const STAGES={1:{n:'NEW',c:'st1'},2:{n:'AUDITING',c:'st2'},3:{n:'READY',c:'st3'},4:{n:'CONTACTED',c:'st4'},5:{n:'MEETING',c:'st5'},6:{n:'WON',c:'st6'},7:{n:'LOST',c:'st7'},8:{n:'NURTURE',c:'st8'}};
const PTS={add:5,test:3,ready:10,meeting:25,won:100,dial:1,scout:10};
const LEVELS=[[0,'ROOKIE'],[50,'HUSTLER'],[120,'OPERATOR'],[250,'CLOSER'],[450,'RAINMAKER'],[700,'MOGUL'],[1000,'EMPIRE']];
let leads=[],me=null,tab='board',filter=0,shopId=null;
let lastTap={x:null,y:null},myPts=null;

/* ============ DRAFT KEEPER (fix: sync re-render was wiping typed input) ============ */
const drafts={};
function trackDrafts(){
  document.getElementById('main').addEventListener('input',e=>{const t=e.target;if(t.id)drafts[t.id]=t.value;});
}
function restoreDrafts(){
  for(const id in drafts){const el=document.getElementById(id);if(el&&el.value!==drafts[id])el.value=drafts[id];}
}
function clearDrafts(ids){ids.forEach(i=>delete drafts[i]);}
function typing(){const a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');}

/* ============ SOUND (tiny 8-bit bleeps) ============ */
let AC=null;
function beep(seq){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d;
    });
  }catch(e){}
}
const sfx={
  pt:()=>beep([[660,.07],[880,.09]]),
  ready:()=>beep([[523,.08],[659,.08],[784,.12]]),
  win:()=>beep([[523,.09],[659,.09],[784,.09],[1047,.2]]),
  tap:()=>beep([[440,.05]])
};

/* ============ STORAGE ============ */
async function loadLeads(){try{const res=await fetch(SUPABASE_URL+'/rest/v1/kv?key=eq.'+encodeURIComponent(KEY)+'&select=value',{headers:SB_HEADERS});if(!res.ok)throw 0;const rows=await res.json();leads=rows.length?JSON.parse(rows[0].value):[];}catch(e){/* keep current leads on transient fetch failure */}}
async function saveLeads(){try{const res=await fetch(SUPABASE_URL+'/rest/v1/kv',{method:'POST',headers:Object.assign({'Prefer':'resolution=merge-duplicates'},SB_HEADERS),body:JSON.stringify({key:KEY,value:JSON.stringify(leads)})});if(!res.ok)throw 0;}catch(e){toast('SAVE FAILED');}}
async function loadMe(){try{me=localStorage.getItem('scaleitivity-me')||null;}catch(e){me=null;}paintMe();}
function paintMe(){
  const d=document.getElementById('me-dot');
  document.getElementById('me-name').textContent=me?P[me].n+' '+me.toUpperCase():'SELECT';
  d.style.background=me?P[me].hex:'var(--dim)';
  d.style.boxShadow=me?'0 0 10px '+P[me].hex:'none';
}

/* ============ PLAYER SELECT ============ */
function openSelect(){
  const bg=document.createElement('div');bg.className='psel-bg';bg.id='psel';
  bg.innerHTML='<div class="psel"><h3>SELECT PLAYER</h3><div class="hint">4 founders. 4 lanes. One machine. Pick yourself.</div><div class="p-grid">'+
    FOUNDERS.map(f=>'<div class="p-card" style="border-color:'+P[f].hex+'" onclick="chooseMe(\''+f+'\')">'+
    '<div class="pn" style="color:'+P[f].hex+'">'+P[f].n+'</div>'+
    '<div class="pv" style="background:'+P[f].hex+'">'+f[0]+'</div>'+
    '<div class="nm3">'+f+'</div><div class="ln">'+P[f].lane+'</div></div>').join('')+
    '</div></div>';
  document.body.appendChild(bg);
}
async function chooseMe(f){
  me=f;try{localStorage.setItem('scaleitivity-me',me);}catch(e){}
  const el=document.getElementById('psel');if(el)el.remove();
  sfx.ready();toast(P[f].n+' '+f.toUpperCase()+' READY');burst(innerWidth/2,innerHeight/2,26);myPts=score()[f].pts;paintMe();render();
}
function needMe(){if(!me){openSelect();return true;}return false;}

/* ============ HELPERS ============ */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function ptToast(p,m){sfx.pt();toast('+'+p+' PTS · '+m.toUpperCase());}
function flash(){const f=document.getElementById('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}
function confetti(){const cs=['#FFD34D','#4DE3FF','#FF5FA2','#6DFF8F'];for(let i=0;i<50;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.top='-12px';d.style.background=cs[i%4];d.style.animation='fall '+(1.2+Math.random()*1.5)+'s linear forwards';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}}
/* ============ CELEBRATION ENGINE ============ */
function shake(){document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),550);}
function flyPts(n){
  const d=document.createElement('div');d.className='flypt';d.textContent='+'+n;
  d.style.left=((lastTap.x!=null?lastTap.x:innerWidth/2)-16)+'px';
  d.style.top=((lastTap.y!=null?lastTap.y:innerHeight*.55)-30)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1150);
}
function burst(x,y,n){
  const cs=['#FFD34D','#4DE3FF','#FF5FA2','#6DFF8F','#FFFFFF'];
  for(let i=0;i<(n||18);i++){
    const d=document.createElement('div');d.className='burst';d.style.left=x+'px';d.style.top=y+'px';d.style.background=cs[i%5];
    document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=60+Math.random()*150;
    d.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+Math.cos(a)*v+'px,'+(Math.sin(a)*v+100)+'px) rotate('+(Math.random()*540-270)+'deg)',opacity:0}],{duration:750+Math.random()*550,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>d.remove();
  }
}
function celebrate(title,sub,mega){
  const bg=document.createElement('div');bg.className='celebrate-bg'+(mega?' mega':'');
  bg.innerHTML='<div class="celeb"><div class="big-t">'+title+'</div>'+(sub?'<div class="sub-t">'+sub+'</div>':'')+'</div>';
  document.body.appendChild(bg);setTimeout(()=>bg.remove(),mega?2600:1700);
  burst(innerWidth/2,innerHeight/2-40,mega?48:22);
  if(mega){confetti();shake();}
}
function checkLevelUp(){
  if(!me)return;const p=score()[me].pts;
  if(myPts!=null&&p>myPts&&levelOf(p)[1]!==levelOf(myPts)[1]){
    const lv=levelOf(p)[1];
    setTimeout(()=>{sfx.win();celebrate('LEVEL UP!',me.toUpperCase()+' IS NOW '+lv,true);},400);
  }
  myPts=p;
}

function auditCount(l){let n=0;const a=l.audit;if(a.a1hrs!==''&&a.a1hrs!=null)n++;if(a.a2text)n++;if(a.a3hrs!==''&&a.a3hrs!=null)n++;if(a.a4count!==''&&a.a4count!=null)n++;if(a.a5days!==''&&a.a5days!=null)n++;return n;}
function igUrl(v){v=(v||'').trim();return /^https?:\/\//i.test(v)?v:'https://instagram.com/'+v.replace(/^@/,'');}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function levelOf(p){let L=LEVELS[0];for(const lv of LEVELS){if(p>=lv[0])L=lv;}return L;}
function nextLevel(p){for(const lv of LEVELS){if(p<lv[0])return lv;}return null;}

/* ============ SCORING ============ */
function daysAgo(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d).getTime())/86400000);}
function score(){
  const s={};FOUNDERS.forEach(f=>s[f]={pts:0,leads:0,audits:0,meetings:0,wins:0,dials:0,wk:0});
  leads.forEach(l=>{
    if(s[l.addedBy]){s[l.addedBy].pts+=PTS.add;s[l.addedBy].leads++;if(daysAgo(l.addedAt)<7)s[l.addedBy].wk+=1;}
    const ac=auditCount(l);
    if(l.auditedBy&&s[l.auditedBy]){
      s[l.auditedBy].pts+=ac*PTS.test;
      if(ac===5&&l.ammo){s[l.auditedBy].pts+=PTS.ready;s[l.auditedBy].audits++;
        if(daysAgo(l.auditedAt)<7)s[l.auditedBy].wk+=2;
        if(s[l.addedBy])s[l.addedBy].pts+=PTS.scout; /* scout confirmed: lead survived the audit */
      }
    }
    (l.dials||[]).forEach(d=>{const who=d.by||'Giancarlo';if(s[who]){s[who].pts+=PTS.dial;s[who].dials++;}});
    if(l.bookedBy&&s[l.bookedBy]&&(l.stage>=5)){s[l.bookedBy].pts+=PTS.meeting;s[l.bookedBy].meetings++;}
    if(l.stage===6&&l.closedBy&&s[l.closedBy]){s[l.closedBy].pts+=PTS.won;s[l.closedBy].wins++;}
  });
  return s;
}
/* ============ MARKET INTEL (secret-shop aggregates = pitch + marketing ammo) ============ */
function intelStats(){
  const A=leads.filter(l=>auditCount(l)>0);
  const nums=k=>A.map(l=>parseFloat(l.audit[k])).filter(v=>!isNaN(v));
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const dm=nums('a1hrs'),form=nums('a3hrs'),rev=nums('a4count'),stars=nums('a4stars'),ig=nums('a5days');
  const yn=l=>{const s=(l.audit.a2text||'').toString().trim().toLowerCase();return s.startsWith('n')?'N':(s.startsWith('y')?'Y':null);};
  const t2=A.filter(l=>yn(l)!==null);
  return {
    n:A.length,
    dmAvg:avg(dm),dmSlow:dm.length?Math.round(100*dm.filter(v=>v>=24).length/dm.length):null,
    noText:t2.length?Math.round(100*t2.filter(l=>yn(l)==='N').length/t2.length):null,
    formAvg:avg(form),revAvg:avg(rev),starAvg:avg(stars),igAvg:avg(ig)
  };
}
function r1(v){return v==null?'—':(Math.round(v*10)/10);}
function copyIntel(){
  const s=intelStats();if(!s.n){toast('NO AUDITS YET');return;}
  const parts=[];
  if(s.dmAvg!=null)parts.push('average '+r1(s.dmAvg)+' hours to answer a filler DM'+(s.dmSlow?' ('+s.dmSlow+'% took a full day or never)':''));
  if(s.noText!=null)parts.push(s.noText+'% never text back a missed call');
  if(s.formAvg!=null)parts.push(r1(s.formAvg)+' hours average to answer their own website form');
  if(s.igAvg!=null)parts.push(r1(s.igAvg)+' days average since their last Instagram post');
  const line='We secret-shopped '+s.n+' med spas as a real patient: '+parts.join(', ')+'. Whoever answers first gets the consult — right now, nobody is answering.';
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(line).then(()=>{sfx.ready();toast('PITCH LINE COPIED');},()=>prompt('Copy this:',line));
  else prompt('Copy this:',line);
}
function isOverdue(l){return l.nextTouch&&(l.stage===3||l.stage===4||l.stage===5||l.stage===8)&&new Date(l.nextTouch)<new Date(new Date().toDateString());}

/* ============ AUDIT CLOCK (Day 0 fire / Day 1 call / Day 2 flip) ============ */
function leadTs(l){return l.ts||(l.addedAt?new Date(l.addedAt+'T00:00:00').getTime():0);}
function auditClock(l){
  if(auditCount(l)===5&&l.ammo)return null;
  const t=leadTs(l);if(!t)return null;
  const h=Math.max(0,Math.floor((Date.now()-t)/3600000));
  if(h<24)return {cls:'ok',txt:'⏱ DAY 0 · '+h+'H IN — FIRE DM + FORM + DESK TONIGHT'};
  if(h<48)return {cls:'warn',txt:'⏱ DAY 1 · '+h+'H IN — LUNCH CALL TODAY'};
  if(h<72)return {cls:'hot',txt:'⏱ DAY 2 · CLOCK EXPIRING — FLIP IT TODAY'};
  return {cls:'hot',txt:'⏱ EXPIRED · '+Math.floor(h/24)+' DAYS IN — FLIP OR KILL'};
}
function sourceStats(){
  const m={};
  leads.forEach(l=>{const k=(l.source||'').trim().toLowerCase();if(!k)return;m[k]=m[k]||{n:0,w:0,label:l.source.trim()};m[k].n++;if(l.stage===6)m[k].w++;});
  return Object.values(m).sort((a,b)=>b.w-a.w||b.n-a.n).slice(0,6);
}

/* ============ GATE ============ */
function paintBadges(){
  const shopQ=leads.filter(l=>l.stage===1||l.stage===2||(l.stage===3&&auditCount(l)<5)).length;
  const closeQ=leads.filter(l=>l.stage===3||l.stage===4||l.stage===5).length;
  const od=leads.filter(isOverdue).length;
  document.querySelectorAll('.bdg').forEach(b=>b.remove());
  const put=(t,n,cls)=>{if(!n)return;const btn=document.querySelector('.nav-btn[data-t="'+t+'"]');if(!btn)return;const b=document.createElement('span');b.className='bdg '+(cls||'');b.textContent=n;btn.appendChild(b);};
  put('shop',shopQ,'g');put('close',od>0?od:closeQ,od>0?'':'g');
}
function paintGate(){
  const wins=leads.filter(l=>l.stage===6);
  const founding=wins.filter(l=>l.result==='Won Founding').length;
  document.getElementById('seats').innerHTML=[0,1,2].map(i=>'<div class="seat'+(i<founding?' filled':'')+'">'+(i<founding?'CLAIMED':'SEAT '+(i+1))+'</div>').join('');
  document.getElementById('track-fill').style.width=Math.min(100,(wins.length/20)*100)+'%';
  document.getElementById('gate-left').textContent=founding>=3?'FOUNDING: SOLD OUT':'FOUNDING SEATS: '+(3-founding);
  const mrr=wins.reduce((s,l)=>s+(parseFloat(l.mrr)||0),0);
  document.getElementById('gate-right').textContent=wins.length+'/20 CLIENTS'+(mrr?' · $'+mrr.toLocaleString()+'/MO':'');
}

/* ============ RENDER ============ */
function go(t){sfx.tap();if(tab==='game'&&t!=='game')pongLeave();tab=t;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
function render(){
  paintGate();paintBadges();
  const m=document.getElementById('main');
  if(tab==='game'){if(!pong.active)m.innerHTML=viewGame();return;}
  if(tab==='board')m.innerHTML=viewBoard();
  if(tab==='hunt')m.innerHTML=viewHunt();
  if(tab==='shop')m.innerHTML=viewShop();
  if(tab==='close')m.innerHTML=viewClose();
  if(tab==='intel')m.innerHTML=viewIntel();
  if(tab==='score')m.innerHTML=viewScore();
  restoreDrafts();
}

/* ---- BOARD ---- */
function viewBoard(){
  const counts={0:leads.length};for(let s=1;s<=8;s++)counts[s]=leads.filter(l=>l.stage===s).length;
  let chips='<div class="chips"><div class="chip'+(filter===0?' on':'')+'" onclick="filter=0;render()">ALL<span class="n">'+counts[0]+'</span></div>';
  for(let s=1;s<=8;s++)chips+='<div class="chip'+(filter===s?' on':'')+'" onclick="filter='+s+';render()">'+STAGES[s].n+'<span class="n">'+counts[s]+'</span></div>';
  chips+='</div>';
  const list=leads.filter(l=>filter===0||l.stage===filter).sort((a,b)=>a.stage-b.stage);
  let cards=list.map(cardHTML).join('');
  if(!leads.length)cards='<div class="empty"><span class="px">STAGE EMPTY</span>First blood goes to whoever adds a spa.<br>HUNT tab. Go.</div>';
  else if(!list.length)cards='<div class="empty">Nothing in this stage yet.</div>';
  return '<h2>THE BOARD</h2><div class="sub-h">Every spa, one card, forever. Tap to work it.</div>'+chips+cards;
}
function cardHTML(l){
  const ac=auditCount(l);
  return '<div class="card'+(l.stage===3?' rdy':'')+'" onclick="openLead('+l.id+')">'+
  '<div class="top"><div><div class="nm">'+esc(l.name)+'</div><div class="city">'+esc(l.city)+(l.owner?' · '+esc(l.owner):'')+'</div></div>'+
  '<div class="stage-pill '+STAGES[l.stage].c+'">'+STAGES[l.stage].n+'</div></div>'+
  (l.ammo?'<div class="ammo">▶ '+esc(l.ammo)+'</div>':'')+
  '<div class="meta">'+(P[l.addedBy]?P[l.addedBy].n+' '+esc(l.addedBy):esc(l.addedBy))+(ac>0&&ac<5?' · AUDIT '+ac+'/5':'')+(l.meetingDate?' · '+esc(l.meetingDate):'')+(l.mrr?' · $'+(+l.mrr).toLocaleString()+'/mo':'')+'</div>'+
  d30Chip(l)+'</div>';
}
function d30Chip(l){
  if(l.stage!==6||!l.closedAt)return '';
  const pc=['live','revival','consults'].filter(k=>l.proof&&l.proof[k]).length;
  if(pc===3)return '<div style="margin-top:9px"><span class="d30-chip" style="border-color:var(--win);color:var(--win)">✓ DAY 30 PROOF LOCKED</span></div>';
  const left=Math.max(0,30-daysAgo(l.closedAt));
  return '<div style="margin-top:9px"><span class="d30-chip'+(left<=7?' danger':'')+'">D30 PROOF: '+pc+'/3 · '+(left>0?left+' DAYS LEFT':'DUE NOW')+'</span></div>';
}

/* ---- HUNT ---- */
function viewHunt(){
  return '<h2>HUNT</h2><div class="sub-h">P2 Chandler + P4 Fein. Med spas only for now. Every spa on the board feeds the shoppers. +'+PTS.add+' pts each.</div>'+
  '<label>SPA NAME *</label><input id="f-name" placeholder="Glow Aesthetics">'+
  '<div class="row2"><div><label>CITY *</label><input id="f-city" placeholder="Newport Beach"></div><div><label>OWNER</label><input id="f-owner" placeholder="Dr. Sarah Kim"></div></div>'+
  '<div class="row2"><div><label>PHONE</label><input id="f-phone" placeholder="949 555 0142"></div><div><label>INSTAGRAM</label><input id="f-ig" placeholder="@glowaesthetics"></div></div>'+
  '<label>SOURCE</label><input id="f-source" placeholder="IG hashtag, drove past, referral...">'+
  '<button class="btn gold" onclick="addLead()">DROP ON BOARD · +'+PTS.add+'</button>';
}
async function addLead(){
  if(needMe())return;
  const name=document.getElementById('f-name').value.trim();
  const city=document.getElementById('f-city').value.trim();
  if(!name||!city){toast('NAME + CITY REQUIRED');return;}
  leads.push({id:Date.now(),name,city,owner:document.getElementById('f-owner').value.trim(),phone:document.getElementById('f-phone').value.trim(),ig:document.getElementById('f-ig').value.trim(),source:document.getElementById('f-source').value.trim(),stage:1,addedBy:me,addedAt:new Date().toISOString().slice(0,10),ts:Date.now(),audit:{a1hrs:'',a2text:'',a3hrs:'',a4count:'',a4stars:'',a5days:''},auditedBy:'',ammo:'',meetingDate:'',bookedBy:'',result:'',closedBy:'',notes:'',dials:[],nextTouch:'',auditedAt:''});
  clearDrafts(['f-name','f-city','f-owner','f-phone','f-ig','f-source']);

/* ============ READINESS SCORE (who to call first) ============ */
function numOf(v){const n=parseFloat(v);return isNaN(n)?null:n;}
function readiness(l){
  const a=l.audit||{};let s=0;
  const dm=numOf(a.a1hrs);if(dm!=null)s+=dm>=24?25:dm>=12?18:dm>=6?10:4;
  const t=(a.a2text||'').toString().trim().toLowerCase();
  if(t.startsWith('n'))s+=15;else if(t.startsWith('y'))s+=3;
  const fm=numOf(a.a3hrs);if(fm!=null)s+=fm>=24?15:fm>=12?10:4;
  const ig=numOf(a.a5days);if(ig!=null)s+=ig>=30?10:ig>=14?7:2;
  const rv=numOf(a.a4count);if(rv!=null)s+=rv<50?10:rv<=150?6:3;
  const st=numOf(a.a4stars);if(st!=null&&st<4.3)s+=5;
  if(l.ammo)s+=10;
  s+=auditCount(l)*2;
  if(l.phone)s+=3;if(l.ig)s+=2;
  return Math.min(100,s);
}
function rdRank(s){return s>=85?['S','#FFD34D']:s>=70?['A','#6DFF8F']:s>=55?['B','#4DE3FF']:s>=40?['C','#FF5FA2']:['D','#8F84B8'];}
function rdBadge(l,mini){
  const s=readiness(l),[g,c]=rdRank(s);
  return '<span class="'+(mini?'rd-mini':'rd-badge')+'" style="border-color:'+c+';color:'+c+'">'+s+' · '+g+'</span>';
}

/* ============ BREAK ROOM: DOUBLES PONG (Supabase Realtime, live 2v2) ============ */
const PW=480,PH=300,PAD_W=10,BALL=10;
const pong={sb:null,ch:null,joined:false,active:false,solo:false,host:false,roster:[],players:[],st:null,padY:{},sentY:null,keys:{up:false,dn:false},raf:0,simT:0,sendT:0,lastState:0,joinedAt:0};

function sbClient(){

function pongJoin(){
  if(needMe())return;
  const sb=sbClient();if(!sb){toast('ARCADE OFFLINE');return;}
  if(pong.joined)return;
  pong.joinedAt=Date.now();
  pong.ch=sb.channel('scaleitivity-pong',{config:{presence:{key:me},broadcast:{self:false}}});
  pong.ch.on('presence',{event:'sync'},pongSync);
  pong.ch.on('broadcast',{event:'start'},({payload})=>pongStart(payload));
  pong.ch.on('broadcast',{event:'pad'},({payload})=>{pong.padY[payload.f]=payload.y;});
  pong.ch.on('broadcast',{event:'state'},({payload})=>{if(!pong.host){pong.prevSt=pong.curSt||null;pong.curSt={s:payload,t:performance.now()};pong.st=payload;pong.lastState=pong.curSt.t;}});
  pong.ch.on('broadcast',{event:'end'},({payload})=>pongEnd(payload));
  pong.ch.subscribe(st=>{
    if(st==='SUBSCRIBED'){
      pong.joined=true;
      const side=(me==='Giancarlo'||me==='Kon')?'L':'R';
      pong.ch.track({f:me,side,at:pong.joinedAt});
      if(tab==='game')render();
    }else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){toast('ARCADE CONNECT FAILED');pongLeave();if(tab==='game')render();}
  });
}
function pongSync(){
  if(!pong.ch)return;
  const ps=pong.ch.presenceState();
  pong.roster=Object.keys(ps).map(k=>({f:k,side:ps[k][0].side,at:ps[k][0].at})).sort((a,b)=>a.at-b.at);
  pong.host=!!pong.roster.length&&pong.roster[0].f===me;
  if(pong.active&&!pong.solo){
    const missing=pong.players.some(p=>!pong.roster.find(r=>r.f===p.f));
    if(missing){pongAbortLocal('PLAYER LEFT — ROUND VOID');return;}
  }
  if(!pong.active&&tab==='game')render();
}
function pongSwitchTo(side){
  const r=pong.roster.find(x=>x.f===me);if(!r||r.side===side)return;
  if(pong.roster.filter(x=>x.side===side).length>=2){toast('TEAM FULL');return;}
  pong.ch.track({f:me,side,at:pong.joinedAt});
}
function pongHostStart(){
  const nL=pong.roster.filter(r=>r.side==='L').length,nR=pong.roster.filter(r=>r.side==='R').length;
  if(!nL||!nR){toast('NEED A PLAYER ON EACH SIDE');return;}
  const payload={roster:pong.roster.map(r=>({f:r.f,side:r.side}))};
  pong.ch.send({type:'broadcast',event:'start',payload});
  pongStart(payload);
}
function pongSolo(){
  if(needMe())return;
  pong.solo=true;pong.joined=true;pong.host=false;
  pongStart({roster:[{f:me,side:'L'},{f:'CPU',side:'R'}]});
}
function buildPlayers(roster){
  const out=[];
  ['L','R'].forEach(side=>{
    const ps=roster.filter(r=>r.side===side);
    ps.forEach((r,i)=>{
      const h=ps.length===2?58:86;
      const minY=ps.length===2&&i===1?PH/2:0;
      const maxY=(ps.length===2&&i===0?PH/2:PH)-h;
      out.push({f:r.f,side,h,minY,maxY,defY:(minY+maxY)/2});
    });
  });
  return out;
}
function pongStart(pl){
  pong.players=buildPlayers(pl.roster);
  pong.active=true;pong.padY={};pong.sentY=null;pong.keys={up:false,dn:false};
  pong.players.forEach(p=>pong.padY[p.f]=p.defY);
  pong.st={bx:PW/2-BALL/2,by:PH/2-BALL/2,vx:0,vy:0,sL:0,sR:0,pads:{},hold:0};
  pong.simT=0;pong.lastState=0;pong.sendT=0;pong.prevSt=null;pong.curSt=null;
  document.body.classList.add('gaming');
  pongScreen();
  let n=3;const co=document.getElementById('pg-count');co.textContent='3';sfx.ready();
  const iv=setInterval(()=>{
    if(!pong.active){clearInterval(iv);return;}
    n--;
    if(n>0){co.textContent=n;sfx.tap();}
    else{clearInterval(iv);co.textContent='';sfx.win();
      if(pong.host||pong.solo){const d=Math.random()<.5?1:-1,a=Math.random()*.7-.35;pong.st.vx=d*3.6*Math.cos(a);pong.st.vy=3.6*Math.sin(a);}
    }
  },900);
  cancelAnimationFrame(pong.raf);pong.raf=requestAnimationFrame(pongDraw);
  pongInput();
}
function pongScreen(){
  const names=s=>pong.players.filter(p=>p.side===s).map(p=>(P[p.f]?P[p.f].n+' ':'')+p.f).join(' + ');
  document.getElementById('main').innerHTML='<h2>BREAK ROOM</h2>'
  +'<div class="pong-score"><span class="s" style="color:var(--gold)" id="pg-sl">0</span><span class="mid">FIRST TO 7<br>'+esc(names('L'))+' vs '+esc(names('R'))+'</span><span class="s" style="color:var(--p2)" id="pg-sr">0</span></div>'
  +'<div id="pong-box"><canvas id="pong-cv" width="'+PW+'" height="'+PH+'"></canvas><div class="count-overlay" id="pg-count"></div></div>'
  +'<button class="btn ghost" onclick="pongQuit()">QUIT TO LOBBY</button>';
}
function pongInput(){
  const cv=document.getElementById('pong-cv');
  const meP=()=>pong.players.find(p=>p.f===me);
  const move=e=>{const p=meP();if(!p)return;const r=cv.getBoundingClientRect();const y=(e.clientY-r.top)/r.height*PH-p.h/2;pong.padY[me]=Math.max(p.minY,Math.min(p.maxY,y));};
  cv.addEventListener('pointermove',move);cv.addEventListener('pointerdown',move);
  document.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='w')pong.keys.up=true;if(e.key==='ArrowDown'||e.key==='s')pong.keys.dn=true;};
  document.onkeyup=e=>{if(e.key==='ArrowUp'||e.key==='w')pong.keys.up=false;if(e.key==='ArrowDown'||e.key==='s')pong.keys.dn=false;};
}
function pongCpu(){
  const p=pong.players.find(x=>x.f==='CPU');if(!p)return;
  const st=pong.st,target=st.vx>0?st.by+BALL/2-p.h/2:PH/2-p.h/2;
  const cur=pong.padY.CPU!=null?pong.padY.CPU:p.defY,d=target-cur;
  pong.padY.CPU=Math.max(p.minY,Math.min(p.maxY,cur+Math.max(-4.4,Math.min(4.4,d*.11))));
}
function pongTick(){
  const st=pong.st;
  if(st.hold>0){st.hold--;return;}
  if(pong.solo)pongCpu();
  st.bx+=st.vx;st.by+=st.vy;
  if(st.by<=0){st.by=0;st.vy=Math.abs(st.vy);}
  if(st.by>=PH-BALL){st.by=PH-BALL;st.vy=-Math.abs(st.vy);}
  const collide=side=>{
    const px=side==='L'?14:PW-14-PAD_W;
    for(const p of pong.players){
      if(p.side!==side)continue;
      const y=pong.padY[p.f]!=null?pong.padY[p.f]:p.defY;
      if(st.bx+BALL>=px&&st.bx<=px+PAD_W&&st.by+BALL>=y&&st.by<=y+p.h){
        const rel=((st.by+BALL/2)-(y+p.h/2))/(p.h/2);
        const sp=Math.min(8.6,Math.hypot(st.vx,st.vy)*1.055);
        st.vx=(side==='L'?1:-1)*Math.max(2.6,Math.abs(sp*Math.cos(rel*.85)));
        st.vy=sp*Math.sin(rel*.85)+rel*1.1;
        st.bx=side==='L'?px+PAD_W:px-BALL;
        return;
      }
    }
  };
  if(st.vx<0)collide('L');else collide('R');
  if(st.bx<-BALL){st.sR++;pongPoint(1);}
  else if(st.bx>PW){st.sL++;pongPoint(-1);}
  st.pads={};pong.players.forEach(p=>{st.pads[p.f]=pong.padY[p.f]!=null?pong.padY[p.f]:p.defY;});
}
function pongPoint(dir){
  const st=pong.st;
  if(st.sL>=7||st.sR>=7){
    const payload={w:st.sL>=7?'L':'R',sL:st.sL,sR:st.sR};
    if(pong.ch&&!pong.solo)pong.ch.send({type:'broadcast',event:'end',payload});
    pongEnd(payload);return;
  }
  st.hold=45;
  st.bx=PW/2-BALL/2;st.by=PH/2-BALL/2;
  const a=Math.random()*.7-.35;
  st.vx=dir*3.6*Math.cos(a);st.vy=3.6*Math.sin(a);
}
function pongDraw(){
  if(!pong.active)return;
  const cv=document.getElementById('pong-cv');
  if(!cv){pongAbortLocal('');return;}
  const cx=cv.getContext('2d'),now=performance.now();
  if(pong.host||pong.solo){
    if(!pong.simT)pong.simT=now;
    let guard=0;
    while(pong.simT<now&&guard++<8){pongTick();pong.simT+=16.7;}
    if(pong.simT<now)pong.simT=now;
    if(pong.ch&&!pong.solo&&now-pong.sendT>66&&pong.active){pong.sendT=now;pong.ch.send({type:'broadcast',event:'state',payload:pong.st});}
  }
  const meP=pong.players.find(p=>p.f===me);
  if(meP){
    if(pong.keys.up)pong.padY[me]=Math.max(meP.minY,(pong.padY[me]!=null?pong.padY[me]:meP.defY)-7);
    if(pong.keys.dn)pong.padY[me]=Math.min(meP.maxY,(pong.padY[me]!=null?pong.padY[me]:meP.defY)+7);
    if(pong.ch&&!pong.host&&!pong.solo&&now-pong.sendT>50&&pong.padY[me]!==pong.sentY){pong.sendT=now;pong.sentY=pong.padY[me];pong.ch.send({type:'broadcast',event:'pad',payload:{f:me,y:pong.padY[me]}});}
  }
  const st=pong.st;
  let bx=st.bx,by=st.by,ipads=null;
  if(!pong.host&&!pong.solo&&pong.curSt){
    const cur=pong.curSt,prev=pong.prevSt,rt=now-110;
    if(prev&&cur.t>prev.t&&Math.abs(cur.s.bx-prev.s.bx)<90&&Math.abs(cur.s.by-prev.s.by)<90){
      const a=Math.max(0,Math.min(1.3,(rt-prev.t)/(cur.t-prev.t))),L=(u,v)=>u+(v-u)*a;
      bx=L(prev.s.bx,cur.s.bx);by=L(prev.s.by,cur.s.by);
      ipads={};for(const k in (cur.s.pads||{}))ipads[k]=(prev.s.pads&&prev.s.pads[k]!=null)?L(prev.s.pads[k],cur.s.pads[k]):cur.s.pads[k];
    }else{
      const dt=Math.min((now-cur.t)/16.7,6);
      bx=cur.s.bx+cur.s.vx*dt;by=cur.s.by+cur.s.vy*dt;ipads=cur.s.pads;
    }
  }
  cx.clearRect(0,0,PW,PH);
  cx.strokeStyle='rgba(143,132,184,.4)';cx.setLineDash([6,10]);cx.beginPath();cx.moveTo(PW/2,0);cx.lineTo(PW/2,PH);cx.stroke();cx.setLineDash([]);
  pong.players.forEach(p=>{
    let y;
    if(p.f===me)y=pong.padY[me];
    else if(pong.host||pong.solo)y=pong.padY[p.f];
    else y=(ipads&&ipads[p.f]!=null)?ipads[p.f]:(st.pads&&st.pads[p.f]!=null?st.pads[p.f]:null);
    if(y==null)y=p.defY;
    const c=P[p.f]?P[p.f].hex:'#8F84B8',x=p.side==='L'?14:PW-14-PAD_W;
    cx.globalAlpha=.28;cx.fillStyle=c;cx.fillRect(x-3,y-3,PAD_W+6,p.h+6);
    cx.globalAlpha=1;cx.fillRect(x,y,PAD_W,p.h);
  });
  cx.globalAlpha=.3;cx.fillStyle='#FFD34D';cx.fillRect(bx-3,by-3,BALL+6,BALL+6);
  cx.globalAlpha=1;cx.fillRect(bx,by,BALL,BALL);
  if(!pong.host&&!pong.solo&&pong.lastState&&now-pong.lastState>2500){
    cx.fillStyle='rgba(7,5,18,.65)';cx.fillRect(0,0,PW,PH);
    cx.fillStyle='#8F84B8';cx.font='10px "Press Start 2P"';cx.textAlign='center';
    cx.fillText('HOST PAUSED — HANG TIGHT…',PW/2,PH/2);cx.textAlign='left';
  }
  const sl=document.getElementById('pg-sl'),sr=document.getElementById('pg-sr');
  if(sl&&sl.textContent!==String(st.sL)){sl.textContent=st.sL;sfx.pt();}
  if(sr&&sr.textContent!==String(st.sR)){sr.textContent=st.sR;sfx.pt();}
  pong.raf=requestAnimationFrame(pongDraw);
}
function pongEnd(pl){
  if(!pong.active)return;
  const wasSolo=pong.solo,mySide=(pong.players.find(p=>p.f===me)||{}).side;
  pong.active=false;pong.solo=false;cancelAnimationFrame(pong.raf);pong.raf=0;pong.simT=0;
  document.body.classList.remove('gaming');
  const wn=pl.w==='L'?'TEAM GOLD':'TEAM ICE',sc=Math.max(pl.sL,pl.sR)+'-'+Math.min(pl.sL,pl.sR);
  if(wasSolo){
    pong.joined=false;
    if(pl.w==='L'){sfx.win();celebrate('YOU WIN!','CPU DOWN '+sc,true);}else celebrate('CPU WINS','PRACTICE MORE');
  }else if(mySide===pl.w){sfx.win();celebrate('VICTORY!',wn+' WINS '+sc,true);}
  else celebrate('GAME OVER',wn+' TAKES IT '+sc);
  setTimeout(()=>{if(tab==='game'&&!pong.active)render();},700);
}
function pongAbortLocal(msg){
  pong.active=false;pong.solo=false;cancelAnimationFrame(pong.raf);pong.raf=0;pong.simT=0;
  document.body.classList.remove('gaming');
  if(msg)toast(msg);
  if(tab==='game')render();
}
function pongQuit(){
  const solo=pong.solo;
  pongAbortLocal('');
  if(solo)pong.joined=false;
  else pongLeave();
  render();
}
function pongLeave(){
  cancelAnimationFrame(pong.raf);pong.raf=0;
  if(pong.ch){try{pong.ch.unsubscribe();}catch(e){}pong.ch=null;}
  pong.joined=false;pong.active=false;pong.solo=false;pong.host=false;pong.roster=[];pong.players=[];pong.simT=0;
  document.body.classList.remove('gaming');
  document.onkeydown=null;document.onkeyup=null;
}

/* ---- BOOT ---- */
async function refresh(){await loadLeads();render();toast('SYNCED');}
function safeRender(){if(!typing()&&!document.getElementById('m-bg'))render();}
(async function(){
  trackDrafts();
  document.addEventListener('pointerdown',e=>{lastTap={x:e.clientX,y:e.clientY};},true);
  await loadMe();await loadLeads();render();
  if(me)myPts=score()[me].pts;
  if(!me)openSelect();
  setInterval(async()=>{
    if(tab==='game')return; /* arcade is realtime; never repaint over a live match */
    await loadLeads();safeRender();
  },25000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden||tab==='game')return;
    loadLeads().then(safeRender);
  });
})();
</script>
